{% extends "base.html" %}
{% block title %}Login — EventBuddy{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-brand">
        <div class="brand-icon">⚡</div>
        <h1>EventBuddy</h1>
        <p>Find your last-minute companion</p>
    </div>
    <form method="POST" class="auth-form">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary full-width">Sign In →</button>
    </form>
    <p class="auth-switch">No account? <a href="{{ url_for('auth.register') }}">Create one free</a></p>
</div>
<div class="auth-visual">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>
{% endblock %}
