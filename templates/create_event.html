{% extends "base.html" %}
{% block title %}Create Event — EventBuddy{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Create Event</h1>
        <p class="page-subtitle">Share what you're up to</p>
    </div>
</div>

<div class="form-card">
    <form method="POST" class="event-form">
        <div class="form-row">
            <div class="form-group">
                <label>Event Title *</label>
                <input type="text" name="title" placeholder="e.g. Concert at NESCO" required>
            </div>
            <div class="form-group">
                <label>Event Type *</label>
                <select name="event_type" required>
                    <option value="">Choose type…</option>
                    <option value="Concert">🎵 Concert</option>
                    <option value="Sports">⚽ Sports</option>
                    <option value="Food">🍜 Food & Dining</option>
                    <option value="Tech">💻 Tech / Hackathon</option>
                    <option value="Art">🎨 Art & Culture</option>
                    <option value="Outdoor">🏕️ Outdoor / Adventure</option>
                    <option value="Party">🎉 Party</option>
                    <option value="Other">✨ Other</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Location *</label>
                <input type="text" name="location" id="locationInput" placeholder="e.g. Ahmedabad, Gujarat" required>
            </div>
            <div class="form-group">
                <label>Date & Time *</label>
                <input type="datetime-local" name="event_time" required>
            </div>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4" placeholder="Tell people what this event is about, what to bring, etc."></textarea>
        </div>
        <div class="map-preview" id="mapPreview" style="display:none;">
            <label>Location Preview</label>
            <iframe id="mapFrame" width="100%" height="200" style="border:0;border-radius:12px;" loading="lazy"></iframe>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('events.dashboard') }}" class="btn-secondary">Cancel</a>
            <button type="submit" class="btn-primary">Publish Event ⚡</button>
        </div>
    </form>
</div>
{% endblock %}
{% block extra_js %}
<script>
const locInput = document.getElementById('locationInput');
const mapPreview = document.getElementById('mapPreview');
const mapFrame = document.getElementById('mapFrame');
let debounceTimer;
locInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
        const val = locInput.value.trim();
        if (val.length > 3) {
            mapFrame.src = `https://maps.google.com/maps?q=${encodeURIComponent(val)}&output=embed&z=13`;
            mapPreview.style.display = 'block';
        }
    }, 800);
});
</script>
{% endblock %}
