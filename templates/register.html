{% extends "base.html" %}
{% block title %}Register — EventBuddy{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-brand">
        <div class="brand-icon">⚡</div>
        <h1>Join EventBuddy</h1>
        <p>Meet people at real-time events</p>
    </div>
    <form method="POST" class="auth-form">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Your name" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
            <label>Phone (optional)</label>
            <input type="tel" name="phone" placeholder="+91 98765 43210">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required minlength="6">
        </div>
        <button type="submit" class="btn-primary full-width">Create Account →</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</div>
<div class="auth-visual">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>
{% endblock %}
